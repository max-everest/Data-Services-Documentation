site_name: Data Services Documentation
site_description: Operational runbooks for the Data Services engineering teams
site_author: Data Services Team
site_url: https://gray-field-0400a2c03.2.azurestaticapps.net
use_directory_urls: false
docs_dir: content

repo_url: https://github.com/max-everest/Data-Services-Documentation
edit_uri: edit/main/content/

draft_docs: |
  **/drafts/
  **/drafts/**

theme:
  name: material
  logo: assets/images/RSM_Standard_White_Logo.png
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.feedback

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_css:
  - ./assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/max-everest/Data-Services-Documentation
  content:
    feedback:
      title: Was this page helpful?
      url: "https://github.com/max-everest/Data-Services-Documentation/issues/new?title=Feedback for: {title}"

nav:
  - Home:
    - Overview: index.md
    - Team:
      - Overview: team/index.md
      - Member Bios: team/members.md
    - Useful Information:
      - Overview: useful-information/index.md
      - Support Model: useful-information/support-model.md
  - Blog: blog/index.md
  - Entity Engine: 
    - Overview: entity-engine/index.md
    - Client Engine: entity-engine/client-engine/index.md
    - API: entity-engine/api.md
  - Data Contracts:
    - data-contracts/index.md
    - Workday:
      - data-contracts/workday/index.md
      - Workday Supplier Invoice:
        - data-contracts/workday/workday-supplier-invoice/index.md
        - Schema: data-contracts/workday/workday-supplier-invoice/schema.md
        - Controls: data-contracts/workday/workday-supplier-invoice/controls.md
        - Operations: data-contracts/workday/workday-supplier-invoice/operations.md
  - Runbooks:
    - Overview: runbooks/index.md
    - Data Engine: runbooks/data-engine/index.md
    - Entity Engine:
      - runbooks/entity-engine/index.md
      - Supplier Invoice:
        - Missing: runbooks/entity-engine/supplier-invoice-missing.md
        - Mismatches: runbooks/entity-engine/supplier-invoice-mismatches.md
      - Client Invoice:
        - Missing: runbooks/entity-engine/client-invoice-missing.md
        - Mismatches: runbooks/entity-engine/client-invoice-mismatches.md
      - Financial Engine:
        - runbooks/entity-engine/financial-engine/index.md
        - System Keys Late: runbooks/entity-engine/financial-engine/system-keys-late.md
    - Template: runbooks/template/index.md
  - SOPs: sops/index.md